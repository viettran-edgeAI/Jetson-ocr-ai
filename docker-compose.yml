services:
  web-app:
    image: jetson-ocr-web:local
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      WEB_APP_DATA_DIR: /app/data/web_app
      OCR_SERVICE_URL: http://ocr:8000
      LLM_SERVICE_URL: http://llm:8081
      WEB_REQUEST_TIMEOUT_SECONDS: 360
    depends_on:
      ocr:
        condition: service_healthy
      llm:
        condition: service_healthy

  ocr:
    build: .
    runtime: nvidia
    depends_on:
      llm:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      OCR_PROFILE: fast
      OCR_ENGINE: paddle_static
      OCR_DOC_ORI_MODEL_DIR: /app/models/PP-LCNet_x1_0_doc_ori_infer
      OCR_DOC_UNWARP_MODEL_DIR: /app/models/UVDoc_infer
      OCR_TEXTLINE_ORI_MODEL_DIR: /app/models/PP-LCNet_x0_25_textline_ori_infer
      OCR_DET_MODEL_DIR: /app/models/PP-OCRv5_mobile_det
      OCR_REC_MODEL_DIR: /app/models/PP-OCRv5_mobile_rec
      OCR_TEXT_RECOGNITION_BATCH_SIZE: 4
      OCR_DATA_DIR: /app/data
      OCR_DEVICE: gpu:0
      OCR_PRELOAD_PIPELINE_ON_STARTUP: "1"
      OCR_WARMUP_ON_STARTUP: "1"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).read()"]
      interval: 30s
      timeout: 5s
      start_period: 240s
      retries: 5

  llm:
    image: jetson-ocr-llm:local
    build:
      context: .
      dockerfile: Dockerfile.llm
    runtime: nvidia
    expose:
      - "8081"
    volumes:
      - ./models/llm:/app/models/llm:ro
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      LLM_MODEL_PATH: /app/models/llm/gemma-4-E2B-it-Q4_K_M.gguf
      LLAMA_SERVER_BIN: /opt/llama.cpp/build/bin/llama-server
      LD_LIBRARY_PATH: /opt/llama.cpp/build/bin:/usr/local/cuda/lib64:/usr/lib/aarch64-linux-gnu/nvidia
      LLM_CTX_SIZE: 8096
      LLM_MAX_OCR_CHARS: 12000
      LLM_MAX_TOKENS: 160
      LLM_TEMPERATURE: 0.2
      LLM_TOP_P: 0.95
      LLM_TOP_K: 40
      LLM_PARALLEL: 1
      LLM_GPU_LAYERS: 10
      LLM_DEVICE: CUDA0
      LLM_FLASH_ATTN: off
      LLM_FIT: off
      LLM_KV_OFFLOAD: 1
      LLM_OP_OFFLOAD: 0
      LLM_DISABLE_THINKING: 1
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=5).read()"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3
